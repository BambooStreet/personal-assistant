# Fly.io 배포 설정(Phase 6+7). 봇은 텔레그램 long-polling(아웃바운드)이고,
# Phase 7부터 데스크톱 접속용 WS 게이트웨이(공개 TLS + PA_GATEWAY_TOKEN)를 노출한다.
# app 이름은 본인 것으로 바꾸거나 `fly launch` 시 지정.

app = "personal-assistant-miya"
primary_region = "nrt" # 도쿄(한국에서 가장 가까움)

[build]
  dockerfile = "Dockerfile"

[env]
  PA_DATA_DIR = "/data"
  PA_GATEWAY_PORT = "8080"

# 데스크톱(Phase 8)이 접속하는 WS 게이트웨이. Fly가 TLS 종단 → wss://<app>.fly.dev.
# 인증은 PA_GATEWAY_TOKEN(시크릿) — 토큰 없으면 봇 코드가 게이트웨이를 안 띄움.
# 스케줄러·봇이 상주해야 하므로 트래픽 없어도 머신 정지 금지.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# SQLite 영속 볼륨. 사전 생성 필요: fly volumes create pa_data -r nrt -n 1 -s 1
[mounts]
  source = "pa_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
